<!DOCTYPE html>
<html>
<head>
  <title>Model Comparison</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .results { display: flex; gap: 20px; margin-top: 20px; }
    .card { flex: 1; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; }
    textarea { width: 100%; height: 80px; }
    button { margin-top: 10px; padding: 10px; }
  </style>
</head>
<body>
  <h2>Compare Base vs Fine-Tuned Model</h2>
  <textarea id="prompt" placeholder="Enter your prompt here"></textarea><br>
  <button onclick="sendPrompt()">Generate</button>

  <div class="results">
    <div class="card">
      <h3>Base Model</h3>
      <pre id="base_output"></pre>
    </div>
    <div class="card">
      <h3>Fine-Tuned Model</h3>
      <pre id="finetuned_output"></pre>
    </div>
  </div>

  <script>
    async function sendPrompt() {
      const prompt = document.getElementById("prompt").value;
      const response = await fetch("http://localhost:8000/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });
      const data = await response.json();
      document.getElementById("base_output").textContent = data.base_output;
      document.getElementById("finetuned_output").textContent = data.finetuned_output;
    }
  </script>
</body>
</html>
